name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  tests_and_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Lint the code
        run: |
          pip install flake8
          flake8 . --exclude=.venv,venv,__pycache__,tests --ignore=E,W,F

      - name: Run unit tests
        run: echo "No unit tests implemented - skipping"

      - name: Run integration tests
        run: echo "No integration tests implemented - skipping"

      - name: Run e2e tests
        run: echo "No e2e tests implemented - skipping"

      - name: Build Docker image (validation only)
        run: docker build -t flask-taskmanager .
        env:
          DOCKER_BUILDKIT: 1

  push_to_dockerhub:
    needs: tests_and_build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/flask-taskmanager:latest
